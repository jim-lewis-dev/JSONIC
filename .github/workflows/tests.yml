name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: Run complete suite
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Run JSONIC tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -p test_jsonic.py -v
      - name: Run example tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -p test_examples.py -v
      - name: Run the demonstration
        run: python examples/demo.py
